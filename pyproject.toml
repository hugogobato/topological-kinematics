[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tk-pilot"
version = "0.1.0"
description = "Topological Kinematics Phase 0 correctness artifacts (gate G0)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "joblib>=1.2",
    "PyYAML>=6.0",
    "matplotlib>=3.7",
    "gudhi>=3.9",
    "persim>=0.3",
]

[project.optional-dependencies]
backends = ["gudhi>=3.9", "persim>=0.3"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
