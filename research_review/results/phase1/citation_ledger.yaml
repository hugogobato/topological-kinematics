        note: "The example shows that unsmoothed Betti or crocker plots are not stable under matrix distances; the related note that crocker stacks are not continuous in the Euclidean norm used for vectorization is on printed p. 32."
      - claim: "Section 4.1/A section-level claim: continuity of time-indexed summaries must be stated at the level of the chosen summary"
        locator: "Section 4.1, printed p. 10; Example 2, printed p. 30; Euclidean-norm caveat printed p. 32"
        status: verified
