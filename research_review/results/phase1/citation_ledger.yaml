schema_version: 1
artifact: "WP-1.1 primary-source citation ledger and implementation availability (agent A3)"
date: "2026-09-20"
method_note: "Local PDFs were extracted with pdftotext -layout into /tmp/opencode/tk_pdfs. Each locator was checked against the displayed equation, definition, or theorem on the cited printed page. Printed page numbers are the folios shown in the supplied PDF where present; where a supplied PDF has no folios the page number means the position in the local PDF page sequence, and the published pagination is given in the note. The image-only email.pdf has no text layer and was rendered with pdftoppm and read as page images. Web availability checks were performed on 2026-09-20; an inaccessible repository is never treated as evidence that no implementation exists."
sources:
  - id: CSEM2006
    citation: "Cohen-Steiner, Edelsbrunner, Morozov, 'Vines and vineyards by updating persistence in linear time', Proc. 22nd Annual Symposium on Computational Geometry (SCG 2006), pp. 119-126, DOI 10.1145/1137856.1137877"
    local_file: "morozov-vineyards-socg06.pdf"
    claims:
      - claim: "Stability d_B(D_p(f),D_p(g)) <= ||f-g||_infinity (Section 2, printed p. 3, DOI 10.1145/1137856.1137877)"
        locator: "Stability Theorem, local PDF p. 3 (Section 2 spans local pp. 2-3); DOI resolves to SCG 2006 pp. 119-126"
        status: verified
        note: "Exact statement found at the top of local p. 3; the published DOI was resolved via doi.org and the author record at https://www.mrzv.org/publications/vineyards/ on 2026-09-20. The local PDF carries no printed folios, so 'printed page N' here is the local PDF page order (published page = 118 + N when the article page range is used)."
      - claim: "Secs. 3-4, pp. 3-7, update pairings and define vineyards, vines, and knees"
        locator: "Section 3, local pp. 3-5 (Pairing Uniqueness Lemma p. 3, transposition cases p. 4, worst-case O(n) update p. 5); Section 4, local pp. 5-6 (Combinatorial Stability Theorem p. 5; vineyard, vine, open/half-open/closed vine, and knee definitions p. 5; protein-folding application pp. 5-6); Section 5 discussion begins local p. 7"
        status: verified
        note: "All cited objects are defined exactly as stated; the page range pp. 3-7 contains Sections 3 and 4 plus the start of Section 5, and the exact vineyard/vine/knee definitions are on local p. 5."
      - claim: "Section 2 claim table: 'A trajectory of diagrams is new' is rejected in the broad form by vineyards and the dynamic topology literature"
        locator: "Vineyard definition, local PDF p. 5; Xian et al. Section 4.1, printed p. 10"
        status: verified
        note: "A vineyard is already a one-parameter family of diagrams with tracked points, so only a narrower decision or diagnostic claim can be novel."
  - id: KRAMAR2016
    citation: "Kramar, Levanger, Tithof, Suri, Xu, Paul, Schatz, Mischaikow, 'Analysis of Kolmogorov flow and Rayleigh-Benard convection using persistent homology', Physica D 334 (2016) 82-98, DOI 10.1016/j.physd.2016.02.003"
    local_file: "1-s2.0-S0167278916000270-am.pdf"
    claims:
      - claim: "Definition 5.1, printed p. 7, defines the bottleneck and degree-p Wasserstein diagram distances"
        locator: "Definition 5.1, printed p. 7, Eqs. (8)-(9); d_B <= d_{W_p} stated as Eq. (12), printed p. 8"
        status: verified
        note: "Eq. (8) is the bottleneck max-inf-sup over bijections; Eq. (9) is the degree-p Wasserstein distance using the L-infinity ground norm with diagonal copies allowed."
      - claim: "PH stability, Eq. (10), printed p. 8"
        locator: "Eq. (10), printed p. 8: d_B(PD(f),PD(g)) <= sup_x |f(x)-g(x)|"
        status: verified
        note: "The accepted-manuscript PDF numbers printed pages 1-21, matching the local page order; the published pagination is Physica D 334, 82-98. Eq. (11) on the same page gives d_B <= 2*epsilon for a numerical approximation with L-infinity error epsilon."
      - claim: "Eq. (16), printed p. 10, defines s_*(t_i) = d_*(PD(f_i),PD(f_{i+1}))/Delta t for * in {B,W1,W2} and calls it an average speed in diagram space"
        locator: "Eq. (16), printed p. 10"
        status: verified
        note: "Verbatim match; the surrounding text says the quantity 'can be interpreted as an average speed in the space of persistence diagrams over the time interval [t_i, t_{i+1}]'."
      - claim: "Studies speed changes in Section 6, printed pp. 9-11"
        locator: "Section 6 begins on printed p. 8 and ends on printed p. 11; the derivative-sign comparison of s_B, s_W1, s_W2 is on printed p. 10; the Figure 10 W2 distance matrix and its discussion begin on printed p. 10, the Figure 9 speed profiles and normalized speed discussion continue on printed p. 11"
        status: verified
        note: "The cited pp. 9-11 are inside Section 6 and contain the speed-change analysis; for citation precision, the section and the speed definition begin one page earlier (p. 8), and the derivative discussion and the metric-dependence warning are on p. 10."
      - claim: "Theorem 7.3, printed p. 14: a delta-dense subsample of a metric point cloud gives a bottleneck perturbation bound"
        locator: "Theorem 7.3, printed p. 14: if Y is a delta-dense subsample of point cloud X, then d_B(PD(X,d),PD(Y,d)) < delta; Definitions 7.1-7.2 on the same page"
        status: verified
        note: "The statement is present as claimed and is attributed in the paper to reference [28]; it is a source-reported theorem about metric point clouds, not about finite-difference speed consistency."
      - claim: "Section 2 claim table: 'Inter-frame persistence-diagram speed is new' is rejected by Kramar et al. Eq. (16), printed p. 10"
        locator: "Eq. (16), printed p. 10"
        status: verified
        note: "The formula is exactly the proposed local speed nu_t = d(D_t,D_{t+1})/Delta t, so the novelty rejection is correct."
  - id: XIAN2021
    citation: "Xian, Adams, Topaz, Ziegelmeier, 'Capturing dynamics of time-varying data via topology', Foundations of Data Science 4(1), 1 (published online 13 December 2021), DOI 10.3934/fods.2021033; supplied manuscript is arXiv:2010.05780v2 (28 June 2021)"
