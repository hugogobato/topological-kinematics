  - id: GIUSTILEE2021
    citation: "Giusti and Lee, 'Signatures, Lipschitz-free spaces, and paths of persistence diagrams', published as SIAM Journal on Applied Algebra and Geometry 7(4), 828-866, DOI 10.1137/22M1528471 (online 14 December 2023); supplied manuscript is arXiv:2108.02727v2 (16 November 2023)"
    local_file: "2108.02727v2.pdf"
    claims:
      - claim: "Eq. (3.1), printed p. 7: Omega = {(b,d) in R^2 : b <= d}, Delta = {(x,x)} subset Omega"
        locator: "Eq. (3.1), printed p. 7; partial p-Wasserstein by matchings on pp. 7-8 and by couplings in Eq. (3.2), printed p. 8"
        status: verified
        note: "Verbatim match; the diagonal-collapsed quotient and the 1-Wasserstein completion follow at pp. 9-10."
      - claim: "Quotient construction, printed pp. 9-10"
        locator: "Definition 4.1, printed p. 9 with the quotient metric formula displayed on printed p. 10"
        status: verified
        note: "The quotient metric is d~(x,y) = min{d(x,y), d(x,A) + d(y,A)} with the diagonal collapsed to a basepoint."
      - claim: "Definition 4.2 and Theorem 4.2, printed pp. 10-11, give an isometric embedding of finite persistence diagrams into a Lipschitz-free space"
        locator: "Definition 4.2, printed p. 10 (Lipschitz-free space as the completion of V_fin under the 1-Wasserstein norm); Theorem 4.2, printed p. 11 (the inclusion D_fin^+(Z) into F(Z) is an isometric embedding)"
        status: verified
        note: "The isometry is for the partial 1-Wasserstein norm only, with no claim for arbitrary W_p or bottleneck; this confirms the plan's Section 3 restriction of the theorem to partial W1."
      - claim: "Section 5, printed pp. 12-15: bounded-variation paths, path signature, tree-like equivalence, and injective/universal/characteristic normalized signatures"
        locator: "Section 5, printed pp. 12-15; Definition 5.1 and Eq. (5.1) for p-variation on printed p. 12; Definition 5.2 and Eq. (5.4) for the signature on printed p. 13, with reparametrization invariance noted after Definition 5.2; Definitions 5.3-5.4, Theorem 5.1 (tree-like equivalence), and Theorems 5.3-5.4 on printed p. 14; Remark 5.2 and the Section 6 heading on printed p. 15"
        status: verified
        note: "Section span confirmed. Audit correction: foundations.md places Theorems 5.3-5.4 on printed p. 15, but the displayed theorem statements are on printed p. 14; p. 15 contains Remark 5.2 and the start of Section 6. The plan's Section 5 page range is correct."
      - claim: "Definition 5.1 and Definition 5.2, printed pp. 12-13"
        locator: "Definition 5.1 printed p. 12; Definition 5.2 printed p. 13"
        status: verified
        note: "Bounded p-variation paths of a Banach space and the iterated-integral signature, exactly as cited."
      - claim: "Section 6, printed pp. 16-20: persistence moments, injectivity and Lipschitz stability, truncation control, and the composition theorem"
        locator: "Section 6 actually spans printed pp. 15-19 (heading on printed p. 15); moment definition, Example 6.1, and Definition 6.1 on printed p. 16; Theorem 6.1 and Lemma 6.1 on printed p. 17; Theorem 6.2 and Definition 6.2 on printed pp. 18-19"
        status: corrected
        note: "The section start is printed p. 15, not p. 16, and it ends on printed p. 19, not p. 20 (printed p. 20 starts Section 7). All cited results are present; use pp. 15-19 for the section and pp. 16-18 for the moment and truncation results."
