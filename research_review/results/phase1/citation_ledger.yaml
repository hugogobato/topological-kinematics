  - id: KHORMALI2025
    citation: "Khormali, 'Hierarchical Persistence Velocity for Network Anomaly Detection: Theory and Applications to Cryptocurrency Markets', arXiv:2512.14615v2 (17 December 2025)"
    local_file: "2512.14615v2.pdf"
    claims:
      - claim: "Sections 3.2-3.4 and Definition 3.1 define a filtration-scale birth/death velocity for a single diagram"
        locator: "Sections 3.2 HNAV and 3.3 HWNAV on printed p. 5; Section 3.4 OW-HNPV on printed p. 6; Definition 3.1 spans printed pp. 6-7; Example 1 and the O(n m n_sub) cost statement on printed p. 7"
        status: verified
        note: "The overlap weight w_i^{j,l} = length([b_i,d_i) intersect [t_jl,t_jl+1)) and the normalization by total persistence P(D) = sum(d_i - b_i) are exactly as described. The plan's range starts at p. 4, which contains the Section 3 introduction and Section 3.1."
      - claim: "Theorem 4.5, printed pp. 8-14: stability of OW-HNPV under the L1 1-Wasserstein distance"
        locator: "Theorem 4.5 statement on printed p. 12; proof spans printed pp. 12-14; Section 4 lemmas 4.1-4.4 span printed pp. 9-12"
        status: corrected
        note: "The theorem is on printed p. 12, not distributed over pp. 8-14; the displayed bound is ||H1-H2||_infinity <= 3 n_sub m / ((beta-alpha) min{P(D1),P(D2)}) * d_1^1(D1,D2)."
      - claim: "Different velocity object, but it precludes broad novelty language around 'topological velocity'; cite as a preprint"
        locator: "Abstract and Sections 3.2-3.4, printed pp. 4-7; arXiv record arXiv:2512.14615 clearly labels the claim 'the first velocity-based perspective on persistence diagrams'"
        status: verified
        note: "The paper's velocity is a within-diagram filtration-scale rate, not a distance-over-time speed, so the plan's distinction is correct; the priority claim itself is source-reported and this ledger does not certify it."
  - id: MALHOTRA2026
    citation: "Malhotra, Ambadkar, Gupta, Kasivel, Schwarz, Ferry, Monod, 'Tracking Representation Dynamics in Large Language Models with Persistent Homology', arXiv:2606.19542v1 (17 June 2026), 29 pages"
    local_file: "2606.19542v1.pdf"
