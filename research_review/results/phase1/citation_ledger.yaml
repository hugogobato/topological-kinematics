        status: verified
        note: "The local v2 front matter contains a placeholder DOI (doi:10.3934/xx.xxxxxxx, pp. X-XX), so the page locators in the plan refer to this v2 pagination, not to the published FoDS pagination; the published DOI resolves via doi.org as verified on 2026-09-20."
      - claim: "Definition 4.1, printed p. 11: crocker stack f_V(t,epsilon,alpha) = rank(V_t(epsilon-alpha) -> V_t(epsilon+alpha))"
        locator: "Definition 4.1, printed p. 11"
        status: verified
        note: "Verbatim match, including the domain [0,T] x [0,infinity) x [0,infinity) and the non-increasing-in-alpha property."
      - claim: "Section 6.3, printed p. 26: d_B(PH(VR(X)),PH(VR(Y))) <= 2 d_GH(X,Y)"
        locator: "Section 6.3, printed p. 26, displayed inequality (attributed to Theorem 5.2 of reference [18])"
        status: verified
        note: "The same page notes the analogous Cech-complex bound and the used (not exact) application of d_GH <= d_H."
      - claim: "Lemmas 7.3-7.4 and Theorem 7.5, printed pp. 31-32"
        locator: "Lemma 7.3 statement and proof, printed p. 31; Lemma 7.4 statement at the foot of printed p. 31, proof on printed p. 32; Theorem 7.5 (continuity of crocker stacks under d_GH^infinity <= delta/2) on printed p. 32"
        status: verified
        note: "Lemma 7.3 gives d_b^p(PH(VR(X)),PH(VR(Y))) <= 2 d_GH^p(X,Y) for 1 <= p <= infinity; the erosion inequalities and the crocker-stack theorem are as described."
      - claim: "Example 2, printed p. 30, shows instability of some visual plots"
        locator: "Example 2 begins at the foot of printed p. 29; the instability computation (beta_0 differs by 3 for n=4 and can be made arbitrarily large for large n) is on printed p. 30"
