  - id: EMAIL2026
    citation: "Diamantis (DAD), co-author proposal 'Topological Kinematics', Gmail printout dated 3 September 2026, local file email.pdf"
    local_file: "email.pdf"
    claims:
      - claim: "The email proposes position, speed/velocity, acceleration, turning, path length, net displacement, trajectory efficiency, and structural instability as the kinematic vocabulary for a sequence of persistence diagrams"
        locator: "email.pdf p. 1 (rendered page image; no text layer)"
        status: verified
        note: "Rendered at 110 dpi with pdftoppm and read as an image; the page lists the eight proposed quantities."
      - claim: "The email defines nu_t = d(D_t,D_{t+1})/(t_{t+1}-t_t), L = sum d(D_t,D_{t+1}), R = d(D_0,D_T), eta = R/L with 0 <= eta <= 1 and L > 0, a_t^speed = (nu_t - nu_{t-1})/Delta t, and cos theta_t = (a^2+b^2-c^2)/(2ab)"
        locator: "email.pdf p. 4, items 5-10 (rendered page image)"
        status: verified
        note: "Formulas match the plan exactly; the same page states 'this cannot be the whole definition of acceleration' and notes that constant-speed direction change is not captured by the scalar speed difference."
      - claim: "The email acknowledges that diagram trajectories and consecutive Wasserstein distance as topological velocity are not new"
        locator: "email.pdf p. 2 literature review ('simply defining consecutive Wasserstein distance as topological velocity would not be a novel contribution by itself'; 'this confirms that scalar topological velocity based on consecutive persistence diagrams already exists') and p. 3 ('the idea of a persistence-diagram trajectory itself is definitely not new')"
        status: verified
        note: "The plan's and foundations' attribution of this withdrawal to the email is accurate; the email also lists vineyards, Kramar, Xian, Giusti-Lee, Khormali, Malhotra, and Bernal-Alvarado as related work."
      - claim: "The email frames stability as an open proof obligation and requires synthetic validation before real data"
        locator: "email.pdf p. 5, items 11-13 (local instability descriptors, stability under perturbations with the epsilon_t + epsilon_{t+1} speed bound, synthetic tests) and p. 6, item 14 (real data only after synthetic validation)"
        status: verified
        note: "The elementary reverse-triangle-inequality bound quoted in the audits is exactly the one displayed on p. 5."
implementation_availability:
  - incumbent: "Cohen-Steiner, Edelsbrunner, Morozov (2006) vineyards"
    url: "https://github.com/mrzv/dionysus"
    status: available
    note: "Dionysus 2, maintained by paper coauthor D. Morozov, implements vineyard updates under adjacent transpositions and linear homotopies; tutorial at https://mrzv.org/software/dionysus2/tutorial/vineyards.html (accessed 2026-09-20). An independent third-party PyPI package 'vineyards' v1.0.x (https://pypi.org/project/vineyards/) extends the 2006 kernel to kinetic point sets; it is not author-maintained and should be verified before use. The frozen pilot environment does not include Dionysus, so vineyards tracking is documentation support only."
  - incumbent: "Kramar et al. (2016) code/data"
    url: "https://math.ou.edu/~mkramar/publications.html"
    status: partial
    note: "The paper states that persistent homology computations used Perseus, which is public (https://people.maths.ox.ac.uk/nanda/perseus/, accessed 2026-09-20). No repository for the paper-specific diagram-distance, speed-profile, or second-PH pipeline and no public copy of the Kolmogorov flow or Rayleigh-Benard simulation data were found on the author page, the arXiv record (1505.06168), or by search on 2026-09-20. Per WP-1.1, absence of a located repository is not evidence that none exists; the paper-specific pipeline is treated as unavailable and is reimplemented transparently."
  - incumbent: "Xian et al. (2021/2022) code"
    url: "https://github.com/lxiancode/tda-crocker"
    status: partial
    note: "Replication repository for the paper exists and contains MATLAB Vicsek simulation code, R crocker plot and crocker stack functions, and some example clustering scripts (accessed 2026-09-20; the repository redirects from https://github.com/xianl-si/tda-crocker). The README refers to analysis scripts crocker-plot-analysis.R, crocker-stack-analysis.R, and op-analaysis.R and to a bottleneck-distance step that are not present in the repository file listing, so end-to-end replication requires gap-filling."
  - incumbent: "Giusti and Lee (2021/2023) code"
    url: "https://github.com/ldarrick/paths-of-persistence-diagrams"
    status: available
    note: "Code linked from the paper ('We develop code to perform signature kernel computations ...') contains Julia code and Python notebooks that reproduce Sections 7.5-7.6, including run_experiments.ipynb, run_heterogeneous_experiments.ipynb, kme_analysis.ipynb, and kme_timing_experiments.ipynb (accessed 2026-09-20). Published paper DOI 10.1137/22M1528471."
  - incumbent: "Malhotra et al. (2026) code (supplementary, beyond the four required baselines)"
    url: "https://github.com/malhotranaman/tracking-representation-dynamics-with-persistent-homology"
    status: available
    note: "Full pipeline released (pure numpy/scipy/analysis package, configs, tests, computed metrics, and figures); heavy artifacts such as checkpoints, activations, and diagram caches are not committed but regenerate from the provided scripts (accessed 2026-09-20)."
  - incumbent: "Khormali (2025) code/data (supplementary)"
    url: "https://arxiv.org/abs/2512.14615"
    status: not found
    note: "No code or data link appears in the PDF or the arXiv record (checked 2026-09-20). This is a not-found result only; it is not evidence that no implementation exists."
  - incumbent: "Bernal-Alvarado et al. (2026) code/data (supplementary)"
    url: "https://arxiv.org/abs/2607.05695"
    status: not found
    note: "No code link appears in the PDF or the arXiv record; source data cited are ORBIS (https://orbis.stanford.edu) and other gazetteers (checked 2026-09-20). This is a not-found result only; it is not evidence that no implementation exists."
